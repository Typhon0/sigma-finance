services:
  woob-service:
    build:
      context: ./server/cmd/woob-service/
    container_name: woob-service
    environment:
      - WOOB_HOST=0.0.0.0
      - WOOB_PORT=50055
    ports:
      - "50055:50055"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50055/health')\" || exit 1"]
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    networks:
      - sigma-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  yfinance-service:
    build:
      context: ./server/cmd/yfinance-service/
    container_name: yfinance-service
    environment:
      - YFINANCE_HOST=0.0.0.0
      - YFINANCE_PORT=50051
      - YFINANCE_HTTP_PORT=50052
      - YFINANCE_RATE_LIMIT=10
    ports:
      - "50051:50051"
      - "50052:50052"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 50051)); s.close()\" || exit 1"]
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sigma-network
    restart: on-failure
    user: "1000:1000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    container_name: sigma-server
    ports:
      - "8080:8080"
    environment:
      - YFINANCE_HOST=yfinance-service
      - YFINANCE_PORT=50051
      - YFINANCE_HTTP_PORT=50052
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-sigma_finance}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - MARKET_DATA_PACK_STORAGE_PATH=/data/market-data/packs
      - MARKET_DATA_PACK_REGISTRY_URL=file:///data/market-data/dist/registry.json
      - MARKET_DATA_AUTO_INSTALL=false
      - MARKET_DATA_DEFAULT_PACKS=core-daily
      - LOGOS_STORAGE_PATH=/data/logos
      - ENABLEBANKING_APPLICATION_ID=${ENABLEBANKING_APPLICATION_ID:-${ENABLE_BANKING_APPLICATION_ID:-}}
      - ENABLEBANKING_PRIVATE_KEY=${ENABLEBANKING_PRIVATE_KEY:-${ENABLE_BANKING_PRIVATE_KEY:-}}
      - ENABLEBANKING_PRIVATE_KEY_PATH=${ENABLEBANKING_PRIVATE_KEY_PATH:-${ENABLE_BANKING_PRIVATE_KEY_PATH:-}}
      - WOOB_SERVICE_URL=${WOOB_SERVICE_URL:-http://woob-service:50055}
      - GOMEMLIMIT=512MiB
      - GOGC=50
    volumes:
      - ./data/market-data:/data/market-data
      - ./data/logos:/data/logos
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M
    depends_on:
      yfinance-service:
        condition: service_started
    networks:
      - sigma-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    profiles:
      - prod
      - full
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: sigma-client
    ports:
      - "${CLIENT_PORT:-3001}:80"
    depends_on:
      - server
    networks:
      - sigma-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # postgres:
  #   image: postgres:15-alpine
  #   container_name: sigma-postgres
  #   environment:
  #     - POSTGRES_USER=${DB_USER}
  #     - "POSTGRES_PASSWORD=${DB_PASSWORD}"
  #     - POSTGRES_DB=${DB_NAME:-sigma_finance}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sigma_finance"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - sigma-network
  #   restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: sigma-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigma-network
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:

networks:
  sigma-network:
    driver: bridge
