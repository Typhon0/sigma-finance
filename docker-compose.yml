services:
  yfinance-service:
    build:
      context: ./server/cmd/yfinance-service/
    container_name: yfinance-service
    environment:
      - YFINANCE_HOST=0.0.0.0
      - YFINANCE_PORT=50051
      - YFINANCE_HTTP_PORT=50052
      - YFINANCE_RATE_LIMIT=10
    ports:
      - "50051:50051"
      - "50052:50052"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 50051)); s.close()\" || exit 1"]
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sigma-network
    restart: on-failure
    user: "1000:1000"

  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    container_name: sigma-server
    ports:
      - "8080:8080"
    environment:
      - YFINANCE_HOST=yfinance-service
      - YFINANCE_PORT=50051
      - YFINANCE_HTTP_PORT=50052
      - DB_HOST=192.168.1.170
      - DB_PORT=5432
      - DB_USER=sigma_finance
      - "DB_PASSWORD=xQxW&yATWuC2N3*8"
      - DB_NAME=sigma_finance
      - DB_SSLMODE=disable
      - MARKET_DATA_PACK_STORAGE_PATH=/data/market-data/packs
      - MARKET_DATA_PACK_REGISTRY_URL=file:///data/market-data/dist/registry.json
      - MARKET_DATA_AUTO_INSTALL=false
      - MARKET_DATA_DEFAULT_PACKS=core-daily
    volumes:
      - ./data/market-data:/data/market-data
    depends_on:
      yfinance-service:
        condition: service_started
    networks:
      - sigma-network
    restart: on-failure

  # postgres:
  #   image: postgres:15-alpine
  #   container_name: sigma-postgres
  #   environment:
  #     - POSTGRES_USER=sigma_finance
  #     - "POSTGRES_PASSWORD=xQxW&yATWuC2N3*8"
  #     - POSTGRES_DB=sigma_finance
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sigma_finance"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - sigma-network
  #   restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: sigma-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigma-network
    restart: on-failure

volumes:
  postgres-data:

networks:
  sigma-network:
    driver: bridge
