[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yfinance-service"
version = "0.1.0"
description = "yfinance gRPC sidecar service for Sigma Finance"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.3.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "curl-cffi>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "mypy>=1.10",
    "mypy-protobuf>=3.0",
    "grpcio-tools>=1.60.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = ["yfinance", "curl_cffi"]
ignore_missing_imports = true

# Test files — relaxed strictness (mocks, fixtures lack precise types)
# Note: tests/ is not a proper Python package (uses sys.path),
# so mypy resolves these as top-level modules.
[[tool.mypy.overrides]]
module = ["conftest", "test_grpc_integration"]
disallow_untyped_defs = false
warn_return_any = false

[project.scripts]
yfinance-service = "servicer:serve"
