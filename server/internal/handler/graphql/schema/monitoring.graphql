"""
Monitoring and analytics schema for dashboard performance tracking
"""

type Query {
  """Get current system health status"""
  systemHealth: SystemHealth!
  
  """Get dashboard performance metrics"""
  performanceMetrics(timeRange: String): PerformanceMetrics!
  
  """Get user engagement analytics"""
  userEngagementMetrics(timeRange: String): UserEngagementMetrics!
  
  """Get specific metric data"""
  metric(name: String!): Metric
  
  """Get all available metrics"""
  metrics: [Metric!]!
}

type Mutation {
  """Record a dashboard monitoring event"""
  recordDashboardEvent(input: DashboardEventInput!): Boolean!
  
  """Create an alert rule"""
  createAlertRule(input: AlertRuleInput!): AlertRule!
  
  """Update an alert rule"""
  updateAlertRule(id: ID!, input: AlertRuleInput!): AlertRule!
  
  """Delete an alert rule"""
  deleteAlertRule(id: ID!): Boolean!
}

type Subscription {
  """Subscribe to real-time performance metrics"""
  performanceMetricsUpdated: PerformanceMetrics!
  
  """Subscribe to system health changes"""
  systemHealthUpdated: SystemHealth!
  
  """Subscribe to alert notifications"""
  alertTriggered: AlertNotification!
}

"""System health status"""
type SystemHealth {
  status: String!
  timestamp: DateTime!
  metricsCount: Int!
  alertsCount: Int!
  recentErrors: Float!
  details: JSON
}

"""Dashboard performance metrics"""
type PerformanceMetrics {
  dashboardStateTransitions: MetricSummary
  dataLoadTimes: MetricSummary
  userInteractions: MetricSummary
  errorRates: MetricSummary
  marketDataUpdates: MetricSummary
}

"""Aggregated metric summary"""
type MetricSummary {
  total: Float!
  average: Float!
  min: Float!
  max: Float!
  p50: Float!
  p95: Float!
  p99: Float!
  lastHour: Float!
  lastDay: Float!
  breakdown: JSON!
}

"""Individual metric data"""
type Metric {
  name: String!
  type: MetricType!
  value: Float!
  labels: JSON!
  aggregations: JSON!
  lastUpdated: DateTime!
}

"""Metric type enumeration"""
enum MetricType {
  COUNTER
  GAUGE
  HISTOGRAM
  TIMING
}

"""User engagement analytics"""
type UserEngagementMetrics {
  totalUsers: Int!
  activeUsers: Int!
  avgSessionDuration: Float!
  topFeatures: [FeatureUsage!]!
  navigationPatterns: [NavigationPattern!]!
  deviceBreakdown: JSON!
  errorsByComponent: JSON!
}

"""Feature usage statistics"""
type FeatureUsage {
  feature: String!
  usageCount: Int!
  uniqueUsers: Int!
  avgDuration: Float!
}

"""User navigation pattern"""
type NavigationPattern {
  pattern: String!
  count: Int!
  avgDuration: Float!
  conversion: Float!
}

"""Alert rule configuration"""
type AlertRule {
  id: ID!
  name: String!
  metricName: String!
  condition: AlertCondition!
  threshold: Float!
  duration: Int!
  labels: JSON!
  actions: [AlertAction!]!
  lastFired: DateTime
  enabled: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Alert condition enumeration"""
enum AlertCondition {
  GREATER_THAN
  LESS_THAN
  EQUAL_TO
  AVG_GREATER_THAN
  AVG_LESS_THAN
  MAX_GREATER_THAN
  MIN_LESS_THAN
}

"""Alert action configuration"""
type AlertAction {
  type: AlertActionType!
  config: JSON!
}

"""Alert action type enumeration"""
enum AlertActionType {
  LOG
  WEBHOOK
  EMAIL
  SLACK
}

"""Alert notification"""
type AlertNotification {
  id: ID!
  alertId: ID!
  alertName: String!
  metricName: String!
  currentValue: Float!
  threshold: Float!
  severity: AlertSeverity!
  timestamp: DateTime!
  message: String!
}

"""Alert severity enumeration"""
enum AlertSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

"""Input for recording dashboard events"""
input DashboardEventInput {
  type: String!
  userId: String
  sessionId: String
  data: JSON!
}

"""Input for creating/updating alert rules"""
input AlertRuleInput {
  name: String!
  metricName: String!
  condition: AlertCondition!
  threshold: Float!
  duration: Int!
  labels: JSON
  actions: [AlertActionInput!]!
  enabled: Boolean!
}

"""Input for alert actions"""
input AlertActionInput {
  type: AlertActionType!
  config: JSON!
}

"""Custom scalar for JSON data"""
scalar JSON

"""Custom scalar for DateTime"""
scalar DateTime