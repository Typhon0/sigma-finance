syntax = "proto3";

package marketdata;

option go_package = "github.com/yourorg/sigma-finance/server/internal/handler/grpc/pb";

// Interval represents candle granularity
enum Interval {
  INTERVAL_UNSPECIFIED = 0;
  INTERVAL_1M = 1;
  INTERVAL_5M = 2;
  INTERVAL_15M = 3;
  INTERVAL_30M = 4;
  INTERVAL_1H = 5;
  INTERVAL_4H = 6;
  INTERVAL_1D = 7;
}

// AssetType represents the type of asset.
//
// REGEN NOTE: Adding a new enum value here requires regenerating BOTH the
// Go bindings (server/internal/handler/grpc/pb/) AND the Python yfinance
// sidecar bindings. The two sides must stay byte-aligned so that the gRPC
// payload semantics match ("ASSET_TYPE_INDEX=5" on Go must decode to the
// same value on the Python sidecar). Until the Python sidecar is
// regenerated, do NOT add new enum values here — Go will compile but the
// sidecar will misclassify the asset type when routing candle fetches.
enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_STOCK = 1;
  ASSET_TYPE_FUND = 2;
  ASSET_TYPE_CRYPTO = 3;
  ASSET_TYPE_ETF = 4;
  ASSET_TYPE_INDEX = 5;
}

// OHLCVBar represents a single candlestick bar
message OHLCVBar {
  int64 timestamp = 1;  // Unix timestamp in milliseconds
  int64 open = 2;       // Price in cents
  int64 high = 3;       // Price in cents
  int64 low = 4;        // Price in cents
  int64 close = 5;      // Price in cents
  double volume = 6;    // Volume (float for flexibility)
}

// PriceRequest requests current price for a symbol
message PriceRequest {
  string symbol = 1;
  AssetType asset_type = 2;
}

// PriceResponse returns current price data
message PriceResponse {
  string symbol = 1;
  int64 bid = 2;        // Price in cents
  int64 ask = 3;        // Price in cents
  int64 last = 4;       // Price in cents
  int64 volume = 5;
  int64 timestamp = 6;  // Unix timestamp in milliseconds
  string source = 7;
}

// HistoryRequest requests historical candle data
message HistoryRequest {
  string symbol = 1;
  AssetType asset_type = 2;
  Interval interval = 3;
  int64 from = 4;       // Unix timestamp in milliseconds
  int64 to = 5;         // Unix timestamp in milliseconds
  int32 limit = 6;      // Max number of candles
}

// HistoryResponse returns historical candle data
message HistoryResponse {
  repeated OHLCVBar bars = 1;
  bool has_more = 2;
  string next_token = 3;
  string source = 4;
  int64 timestamp = 5;  // Unix timestamp in milliseconds
}

// InfoRequest requests company/fund info
message InfoRequest {
  string symbol = 1;
  AssetType asset_type = 2;
}

message SearchRequest {
  string query = 1;
  string asset_type = 2;
  int32 max_results = 3;
}

message SearchResult {
  string symbol = 1;
  string name = 2;
  string exchange = 3;
  string exchange_code = 4;
  string country = 5;
  string currency = 6;
  string asset_type = 7;
  string provider_source = 8;
  string provider_external_id = 9;
  string isin = 10;
  string figi = 11;
  string cusip = 12;
}

message SearchResponse {
  repeated SearchResult results = 1;
  string provider = 2;
  int64 timestamp = 3;
}

// CompanyInfo contains fundamental data for stocks/funds
message CompanyInfo {
  string symbol = 1;
  string name = 2;
  string exchange = 3;
  string sector = 4;
  string industry = 5;
  string currency = 6;
  string timezone = 7;
  int64 market_cap = 8;
  double pe_ratio = 9;
  double dividend_yield = 10;
  int64 beta = 11;
  int64 shares_outstanding = 12;
  int64 revenue = 13;
  int64 earnings = 14;
  int64 debt = 15;
  double eps = 16;
  int64 fifty_two_week_high = 17;
  int64 fifty_two_week_low = 18;
  string description = 19;
}

// CryptoInfo contains fundamental data for cryptocurrencies
message CryptoInfo {
  string symbol = 1;
  string name = 2;
  string blockchain = 3;
  int32 decimals = 4;
  bool is_stablecoin = 5;
  int64 market_cap = 6;
  int64 volume_24h = 7;
  int64 circulating_supply = 8;
  int64 total_supply = 9;
  int64 max_supply = 10;
  double eps = 11;
  int64 fifty_two_week_high = 12;
  int64 fifty_two_week_low = 13;
  string description = 14;
}

// InfoResponse returns company/fund info
message InfoResponse {
  oneof info {
    CompanyInfo company = 1;
    CryptoInfo crypto = 2;
  }
  string source = 3;
  int64 timestamp = 4;  // Unix timestamp in milliseconds
}

// BatchPriceRequest requests prices for multiple symbols
message BatchPriceRequest {
  repeated string symbols = 1;
  AssetType asset_type = 2;
}

// BatchPriceItem represents price for a single symbol in batch
message BatchPriceItem {
  string symbol = 1;
  int64 price = 2;      // Price in cents
  int64 volume = 3;
  int64 timestamp = 4;  // Unix timestamp in milliseconds
  string error = 5;     // Error message if failed
}

// BatchPriceResponse returns prices for multiple symbols
message BatchPriceResponse {
  repeated BatchPriceItem prices = 1;
  string source = 2;
  int64 timestamp = 3;  // Unix timestamp in milliseconds
}

// MarketDataService provides market data via gRPC
service MarketDataService {
  // GetPrice returns current price for a symbol
  rpc GetPrice(PriceRequest) returns (PriceResponse);

  // GetHistory returns historical OHLCV data
  rpc GetHistory(HistoryRequest) returns (HistoryResponse);

  // GetInfo returns company/fund information
  rpc GetInfo(InfoRequest) returns (InfoResponse);

  // SearchInstruments returns normalized instrument lookup results
  rpc SearchInstruments(SearchRequest) returns (SearchResponse);

  // GetBatchPrices returns prices for multiple symbols
  rpc GetBatchPrices(BatchPriceRequest) returns (BatchPriceResponse);
}
